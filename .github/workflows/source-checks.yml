name: Source snapshot checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-only:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python tools/verify-public-tree.py
      - run: python tools/beta/test_assembly.py
      - run: python tools/beta/test_owner_recovery.py
