name: Bug report
description: Report a beta behavior problem without private device data
title: "[Bug] "
body:
  - type: input
    id: build
    attributes: {label: Beta build, placeholder: "1793400160"}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce, description: "Describe expected and actual results. Do not include PINs, identifiers, account data or raw logs."}
    validations: {required: true}
  - type: textarea
    id: host
    attributes: {label: Environment, description: "Computer OS, Python and Platform-Tools versions; previous ROM; bootloader already unlocked or not."}
  - type: textarea
    id: evidence
    attributes: {label: Redacted observations, description: "Installation stage, exact non-private error, frequency and conditions. Do not upload your working folder, firmware or personalized recovery."}
